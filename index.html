<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>For My Bhai ❤️</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


<div class="background">

    <div class="stars"></div>

    <div class="heart heart1">♡</div>
    <div class="heart heart2">♡</div>
    <div class="heart heart3">♡</div>
    <div class="heart heart4">♡</div>

</div>



<main class="container">


    <div class="badge">

        🔐 A LITTLE SOMETHING FOR MY BHAI

    </div>



    <h1>

        BHAI ❤️

    </h1>



    <p class="subtitle">

        Some bonds aren't made by blood.
        They're made by memories. 🫶

    </p>



    <!-- COUNTDOWN -->

    <div class="countdown-card">

        <div class="count-title">

            NEXT SURPRISE UNLOCKS IN

        </div>


        <div id="nextDate"
             class="next-date">

            Loading...

        </div>



        <div class="countdown">


            <div class="time">

                <span id="days">
                    00
                </span>

                <small>
                    DAYS
                </small>

            </div>



            <div class="time">

                <span id="hours">
                    00
                </span>

                <small>
                    HOURS
                </small>

            </div>



            <div class="time">

                <span id="minutes">
                    00
                </span>

                <small>
                    MINUTES
                </small>

            </div>



            <div class="time">

                <span id="seconds">
                    00
                </span>

                <small>
                    SECONDS
                </small>

            </div>


        </div>

    </div>



   

    <!-- SURPRISES -->

    <section id="surprises"></section>



    <!-- DAY TRACKER -->

    <section class="journey">


        <h2>

            OUR RAKHI COUNTDOWN 💜

        </h2>


        <p>

            One surprise. Every day.

        </p>


        <div id="daysList"></div>


    </section>



    <footer>

        Made with ❤️ especially for Bhai

    </footer>


</main>



<script src="script.js"></script>


</body>

</html>
